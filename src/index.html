<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro Kanban Teste</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Quadro Kanban</h1>
    <p id="progress-text" role="status"></p>
    <progress id="progress" max="100" value="0"></progress>
  </header>

  <form id="form" class="toolbar">
    <input id="title" type="text" placeholder="Nova tarefa" aria-label="Titulo da tarefa" maxlength="80">
    <select id="priority" aria-label="Prioridade">
      <option value="baixa">Baixa</option>
      <option value="media" selected>Media</option>
      <option value="alta">Alta</option>
    </select>
    <button type="submit">Adicionar</button>
  </form>
  <p id="error" class="error" role="alert"></p>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar" aria-label="Buscar tarefas">
    <select id="filter-priority" aria-label="Filtrar por prioridade">
      <option value="todas">Todas</option>
      <option value="baixa">Baixa</option>
      <option value="media">Media</option>
      <option value="alta">Alta</option>
    </select>
    <button id="export" type="button">Exportar JSON</button>
  </div>

  <main class="board">
    <section>
      <h2>A fazer <span id="count-todo" class="count">0</span></h2>
      <ul id="list-todo"></ul>
    </section>
    <section>
      <h2>Fazendo <span id="count-doing" class="count">0</span></h2>
      <ul id="list-doing"></ul>
    </section>
    <section>
      <h2>Feito <span id="count-done" class="count">0</span></h2>
      <ul id="list-done"></ul>
    </section>
  </main>

  <footer>Versao <span id="version">__VERSION__</span></footer>

  <script src="tasks.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>

name: Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]

env:
  PROJETO: pipeline-devops

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash script_lint.sh

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash script_test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash script_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  sast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: bash script_sast.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-sast
          path: reports/semgrep.json

  dast:
    needs: [build, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      - run: bash script_dast.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-dast
          path: reports/zap-report.html

  deploy:
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      - run: ls dist
      - run: echo "Deploy do $PROJETO versao $(cat dist/version.txt) realizado"

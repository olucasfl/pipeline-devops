name: Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]

env:
  PROJETO: pipeline-devops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash script_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash script_test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      - run: ls dist
      - run: echo "Deploy do $PROJETO realizado"

